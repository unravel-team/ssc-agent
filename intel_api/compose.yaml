# Sources API for the company network: nginx (TLS, the only open ports) -> api -> Postgres.
#   cd intel_api && cp .env.example .env   (fill it in)   &&   docker compose up -d --build
# Images are pinned by digest and Debian-based (glibc), none on Alpine/musl. Postgres is on an internal network with no
# route out and no published port.

name: ssc-intel

services:
  postgres:
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    restart: unless-stopped
    environment:
      POSTGRES_DB: intel
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in intel_api/.env}
    volumes:
      - pgdata-debian:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m

  api:
    build:
      context: .                       # this folder (see .dockerignore for what goes in)
    image: ssc-intel-api:local
    restart: unless-stopped
    env_file: .env                     # SSC_INTEL_API_KEYS and the optional source tokens
    environment:
      SSC_INTEL_DB_URL: postgresql://intel:${POSTGRES_PASSWORD}@postgres:5432/intel
      # the keys in .env, plus the agents container's own key
      SSC_INTEL_API_KEYS: ${SSC_INTEL_API_KEYS},agent:${SSC_AGENT_KEY:?set SSC_AGENT_KEY in intel_api/.env}
      # the agents' secrets are not the API's business
      API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ""
      SSC_AGENT_KEY: ""
      APP_URL: ${APP_URL:-https://canary-listener.fly.dev/abc}
    volumes:
      # what is tracked and how sources are rated: edit on the host; scope.json is re-read on every job run,
      # sources.json on restart (docker compose restart api)
      - ./config:/app/intel_api/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, egress]        # egress: the background jobs fetch from the public sources
    ports:
      # this machine only (127.0.0.1): local tools and the scanner on the same computer, plain HTTP that never
      # leaves the machine. Every other computer comes in through nginx over HTTPS.
      - "127.0.0.1:${API_LOCAL_PORT:-8787}:8787"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # runs only the agents: headless Claude Code writes the advisory for each scan. It gets no database access and
  # none of .env: only its own agent key and the Claude credentials. It reaches the API directly (not via nginx).
  agents:
    build:
      context: ./agents
    image: ssc-intel-agents:local
    restart: unless-stopped
    environment:
      SSC_INTEL_API: http://api:8787
      SSC_AGENT_KEY: ${SSC_AGENT_KEY:?set SSC_AGENT_KEY in intel_api/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SSC_AGENT_BUDGET_USD: ${SSC_AGENT_BUDGET_USD:-3}
      SSC_AGENT_MODEL: ${SSC_AGENT_MODEL:-}
      SSC_VERIFY_MODEL: ${SSC_VERIFY_MODEL:-claude-opus-5-5}   # the support check (agents/runner.py)
      SSC_VERIFY_BUDGET_USD: ${SSC_VERIFY_BUDGET_USD:-0.5}
    depends_on:
      api:
        condition: service_healthy
    networks: [egress]                 # the API, and Anthropic's API for Claude
    read_only: true
    tmpfs: [/tmp, "/work:uid=10002,gid=10002", "/home/agent:uid=10002,gid=10002"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.30.6-trixie@sha256:42c68eab6f7e22611786a9fe1d1c019e275c50185bd54b8f75dc2b9184322703
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [egress]

networks:
  backend:
    internal: true                     # Postgres and the API's database traffic: no route outside
  egress: {}

volumes:
  pgdata-debian: {}               # Debian (glibc) Postgres; the earlier Alpine volume was dumped and restored into it
