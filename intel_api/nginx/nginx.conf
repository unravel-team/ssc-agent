# nginx in front of the sources API: TLS, company-network allow list, rate limits, size and time limits.
# The API checks the keys (Authorization: Bearer <key> or X-API-Key); nginx never sees or logs them.

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # access log without query strings (they can hold package names, never keys) and without auth headers
    log_format api '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent ${request_time}s rid=$request_id';
    access_log /dev/stdout api;

    # 10 requests/s per client address, bursts of 50 (a laptop agent sends up to 8 at once)
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/s;
    limit_req_status 429;
    # lookups that miss the database fetch from the sources: at most 4 at a time per client
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    upstream intel_api {
        server api:8787;
        keepalive 16;
    }

    # plain HTTP: redirect to HTTPS (health stays reachable for load balancers)
    server {
        listen 80;
        location = /v1/health { proxy_pass http://intel_api; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        # company network only (edit to your ranges). Docker Desktop may show every client as its gateway address.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        client_max_body_size 5m;          # same as the API's own limit
        client_body_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;

        location /v1/ {
            limit_req  zone=per_client burst=50 nodelay;
            limit_conn conns 16;
            proxy_pass http://intel_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 900s;      # a large lookup of packages not stored yet can take minutes
            proxy_send_timeout 60s;
        }

        # anything else is not part of the API
        location / { default_type application/json; return 404 '{"error": "not found"}'; }

        # errors from nginx itself, as JSON like the API's own
        error_page 403 = @forbidden;
        error_page 429 = @too_many;
        error_page 502 503 504 = @unavailable;
        location @forbidden   { default_type application/json; return 403 '{"error": "not allowed from this network"}'; }
        location @too_many    { default_type application/json; return 429 '{"error": "too many requests, slow down"}'; }
        location @unavailable { default_type application/json; return 503 '{"error": "the sources API is not available, try again shortly"}'; }
    }
}
